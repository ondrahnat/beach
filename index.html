<style>
/* Layout: one column like the tournament board at the venue; sticky top bar, filters + tournament list, then a tournament detail (her day, final standings, groups as cross tables, bracket). */
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --sunk:#E7EDF1; --line:#D3DDE4;
  --ink:#10202B; --muted:#5A6B77;
  --accent:#1652C8; --accent-ink:#FFFFFF; --mark:#FFD23F; --mark-ink:#2A2100; --mark-soft:#FFF4C7;
  --win:#13804A; --loss:#B4372B; --proj:#7A5AC8;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C151C; --surface:#13202A; --sunk:#0F1A22; --line:#24343F;
  --ink:#E6EEF3; --muted:#93A6B3;
  --accent:#6E9CFF; --accent-ink:#06142E; --mark:#FFD23F; --mark-ink:#2A2100; --mark-soft:#3A3212;
  --win:#4CC98A; --loss:#F07C6E; --proj:#B69CFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C151C; --surface:#13202A; --sunk:#0F1A22; --line:#24343F;
  --ink:#E6EEF3; --muted:#93A6B3;
  --accent:#6E9CFF; --accent-ink:#06142E; --mark:#FFD23F; --mark-ink:#2A2100; --mark-soft:#3A3212;
  --win:#4CC98A; --loss:#F07C6E; --proj:#B69CFF; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:9px}
.brand{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:8px;line-height:1;color:var(--ink);text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.ball{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:conic-gradient(var(--accent) 0 33%,var(--mark) 0 66%,var(--surface) 0);border:2px solid var(--ink)}
.topright{display:flex;align-items:center;gap:10px}
.topbtn{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 11px;white-space:nowrap}
.topbtn:disabled{opacity:.6;cursor:default}
.topbtn .ri{font-size:15px;line-height:1}
.updated{font-size:12px;color:var(--muted);text-align:right}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{display:flex;align-items:center;gap:5px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:700;padding:5px 8px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--sunk);color:var(--ink)}
.lang svg{width:18px;height:12px;border-radius:2px;box-shadow:0 0 0 1px var(--line)}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:.01em}
h2{font-size:22px;text-transform:uppercase}
h3{font-size:18px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.note{font-size:13px;color:var(--muted);max-width:70ch;margin:0}
.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px;padding-top:16px}
.prof{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:76px 1fr;gap:12px 14px;align-items:start}
.prof .ph{width:76px;height:76px;border-radius:50%;overflow:hidden;background:var(--mark);color:var(--mark-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:30px;border:3px solid var(--mark)}

.xt td.cell b{display:block;font-family:var(--display);font-size:17px}

.xt tr.mine th[scope="row"],.xt th.mine{background:var(--mark-soft)}

.bm{background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:13px;overflow:hidden}

.bm .row{display:grid;grid-template-columns:1fr auto;gap:6px;padding:6px 9px;align-items:center}

.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}

.tbl tr.mine td{background:var(--mark-soft)}
.tbl .club{display:block;color:var(--muted);font-size:11px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:18px;display:grid;gap:6px}
.admin{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.admin form{display:flex;flex-wrap:wrap;gap:8px}
.admin input{flex:1 1 260px;min-width:0;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.btn{font:inherit;font-weight:600;border:0;border-radius:9px;padding:9px 14px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.reqs{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13px}
.reqs li{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:4px}

@media (max-width:560px){.hero h1{font-size:26px}.tl{grid-template-columns:52px 1fr auto}.trow{grid-template-columns:58px 1fr}.trow .who{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;justify-content:flex-start}.trow .pill.chipwrap{text-align:left}.updated{display:none}
 .brand{font-size:16px;white-space:nowrap;gap:5px;letter-spacing:0}.ball{width:15px;height:15px}.lang .lt{display:none}.topbtn .rt{display:none}.topbtn{padding:6px 8px}.lang button{padding:6px 5px}.topright{gap:6px}header.top .wrap{gap:6px}
 .filters{grid-template-columns:1fr 1fr;gap:8px}.filters select{padding:7px 8px;font-size:13px}
 .prof{grid-template-columns:60px 1fr;padding:12px}.prof .ph{width:60px;height:60px;font-size:22px}.prof h2{font-size:22px}
 .xt{min-width:0;font-size:12px}.xt .sum{display:none}.xt thead th .pn{display:none}.xt thead th .no{font-size:15px;margin:0}.xt .corner{font-size:13px;width:auto}
 .xt th[scope="row"]{width:auto}.xt th[scope="row"] .pn,.xt th[scope="row"] .club{display:none}.xt th[scope="row"] .sn{display:block}.xt th[scope="row"] .no{float:none;margin:0 4px 0 0;display:inline}
 .xt th,.xt td{padding:5px 3px}.xt td.cell b{font-size:15px}.xt td.cell small{font-size:10px}.xt .rank{font-size:16px}
 .bracket{grid-template-columns:1fr!important;min-width:0!important}.bracket-scroll{overflow-x:visible}.bcol{justify-content:flex-start}
 .herbox{padding:12px}.herbox .who b{font-size:21px}.paths{grid-template-columns:1fr}}
.xt .sn{display:none;font-weight:600}
.fulllist{margin-top:6px}.fulllist summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;padding:6px 0}
@media (prefers-reduced-motion:no-preference){.seg button,.trow{transition:background .15s,border-color .15s}}

<script id="engine">
/* ================= Draw engine (pure functions, no DOM) ================= */
// "X" = scratched / walkover side on the PVS boards (e.g. "X:2")
function parseSets(s){if(!s)return null;const m=String(s).match(/(\d+|X)\s*:\s*(\d+|X)/i);if(!m)return null;const xa=/x/i.test(m[1]),xb=/x/i.test(m[2]);if(xa&&xb)return null;if(xa)return [0,Math.max(1,+m[2])];if(xb)return [Math.max(1,+m[1]),0];return [+m[1],+m[2]]}
function parsePoints(p){if(!p)return [0,0];let a=0,b=0;for(const m of String(p).matchAll(/(\d+)\s*:\s*(\d+)/g)){a+=+m[1];b+=+m[2]}return [a,b]}
function winLose(m){if(!m||!m.a||!m.b)return null;const s=parseSets(m.sets);if(!s)return null;return s[0]>s[1]?{w:m.a,l:m.b}:{w:m.b,l:m.a}}
// Group table: wins, then for ties a small table (sets ratio, balls ratio), then big table sets ratio, balls ratio.
function standings(teamKeys,matches){
  const st=Object.fromEntries(teamKeys.map(k=>[k,{key:k,played:0,won:0,lost:0,sw:0,sl:0,pw:0,pl:0}]));
  const done=matches.filter(m=>parseSets(m.sets)&&st[m.a]&&st[m.b]);
  for(const m of done){const [sa,sb]=parseSets(m.sets),[pa,pb]=parsePoints(m.points);const A=st[m.a],B=st[m.b];
    A.played++;B.played++;A.sw+=sa;A.sl+=sb;B.sw+=sb;B.sl+=sa;A.pw+=pa;A.pl+=pb;B.pw+=pb;B.pl+=pa;if(sa>sb){A.won++;B.lost++}else{B.won++;A.lost++}}
  const ratio=(w,l)=>l===0?(w===0?0:1e9):w/l;
  const mini=keys=>{const set=new Set(keys);const t=Object.fromEntries(keys.map(k=>[k,{sw:0,sl:0,pw:0,pl:0}]));
    for(const m of done){if(set.has(m.a)&&set.has(m.b)){const [sa,sb]=parseSets(m.sets),[pa,pb]=parsePoints(m.points);t[m.a].sw+=sa;t[m.a].sl+=sb;t[m.b].sw+=sb;t[m.b].sl+=sa;t[m.a].pw+=pa;t[m.a].pl+=pb;t[m.b].pw+=pb;t[m.b].pl+=pa}}return t};
  const byWins={};for(const r of Object.values(st))(byWins[r.won]??=[]).push(r);
  const out=[];
  for(const w of Object.keys(byWins).map(Number).sort((a,b)=>b-a)){const tied=byWins[w];
    if(tied.length>1){const t=mini(tied.map(r=>r.key));

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DATA=null,cur=null,mode='auto',leagueSel={};
let F={player:'all',series:'all',cat:'all',season:'all'};try{Object.assign(F,JSON.parse(localStorage.getItem('filters')||'{}'))}catch{}
const loc=()=>LANG==='cs'?'cs-CZ':'en-GB';
const fmtDate=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString(loc(),{day:'numeric',month:'numeric',year:'numeric'})}catch{return d}};
const fmtDay=d=>{try{return new Date(d+'T12:00:00').toLocaleDateString(loc(),{weekday:'short'})}catch{return ''}};

const FIRST=p=>p.split(' ')[0];
function focusOf(team){if(!team||!DATA)return null;const names=[team.p1,team.p2].map(x=>(x||'').toLowerCase());return DATA.players.filter(p=>names.includes(p.toLowerCase()))}
function focusKeys(league){return league.teams.filter(t=>(focusOf(t)||[]).length).map(t=>t.key)}
function seriesOf(t){if(t.series)return t.series;if(t.source==='cvf')return 'abv';return /letní/i.test(t.name)?'leto':'pbl'}
function seasonOf(t){const d=new Date(t.date+'T12:00:00');if(seriesOf(t)==='pbl'){const y=d.getMonth()>=7?d.getFullYear():d.getFullYear()-1;return `${y}/${String(y+1).slice(2)}`}return String(d.getFullYear())}
function catOf(t){return (t.category||'').replace('Ž','').replace('Z','')}
function playersIn(t){const out=new Set();for(const l of t.leagues)for(const tm of l.teams)for(const p of (focusOf(tm)||[]))out.add(p);return [...out]}
const isCvf=l=>(l.system||'').startsWith('cvf-');
function statusOf(t){const today=new Date().toISOString().slice(0,10);if(t.date<today&&t.status!=='upcoming')return 'finished';if(t.date<today&&t.status==='upcoming'&&t.leagues&&t.leagues.length)return 'finished';return t.status}

/* ---- build a league model (PVS or ČVS) ---- */
function buildPvs(t,league,forceProj){
  const n=league.teams.length;const bySeed=Object.fromEntries(league.teams.map(x=>[x.seed,x]));const byKey=Object.fromEntries(league.teams.map(x=>[x.key,x]));
  const off=league.official&&league.official.groups&&league.official.groups.length&&!forceProj?league.official:null;
  const layout=pvsLayout(n);let groups;
  if(off)groups=off.groups.map(g=>({name:g.name,teams:g.teams.filter(Boolean),matches:(g.matches||[]).map(m=>({...m}))}));
  else groups=layout.groups.map(g=>({name:g.name,teams:g.slots.filter(Boolean).map(s=>bySeed[s]?.key).filter(Boolean),
      matches:groupSchedule(layout,g).map(m=>({round:m.round,a:bySeed[m.a]?.key,b:bySeed[m.b]?.key,sets:null,points:null,court:null}))}));
  const stand={};for(const g of groups)stand[g.name]=standings(g.teams,g.matches.filter(m=>byKey[m.a]&&byKey[m.b]));
  let tpl=null;if(layout.playoff==='12T-4G'&&groups.length===4)tpl=playoff12(layout.kind==='g4x5');if(layout.playoff==='8T-2G'&&groups.length===2)tpl=playoff8();
  const po=tpl?resolvePlayoff(tpl,stand,off?.playoff):null;
  const groupViews=groups.map(g=>{const pos=Object.fromEntries(g.teams.map((k,i)=>[k,i+1]));
    return {name:g.name,teams:g.teams,matches:g.matches.filter(m=>pos[m.a]&&pos[m.b]).map(m=>({...m,lab:pos[m.a]+'-'+pos[m.b]})),rank:stand[g.name],kind:'rr'}});
  const ko=po?Object.values(po).map(r=>({id:r.t.id,t:r.t,A:r.A,B:r.B,match:r.match})):[];
  const fin=po?finalStandings(po):null;const pf=pointsFinal(league.teams,league.name);
  return {kind:'pvs',n,layout,byKey,groups:groupViews,ko,tpl,official:!!off,officialPlayoff:off?.playoff||[],final:pf||(fin?fin.map(r=>({...r,pts:pvsPoints(league.name,r.place)})):null),
    hasOfficial:!!(league.official&&league.official.groups&&league.official.groups.length)};
}
function buildCvf(t,league,forceProj){
  const byKey=Object.fromEntries(league.teams.map(x=>[x.key,x]));
  const mainL=t.leagues.find(l=>l.system&&l.system!=='cvf-q18');
  const tpl=cvfTemplate(league.system,{mainSize:mainL?cvfTemplate(mainL.system)?.size:24});
  const hasOff=!!(league.official&&league.official.matches&&league.official.matches.length);
  if(!tpl)return {kind:'cvf-raw',byKey,groups:[],ko:[],official:hasOff,hasOfficial:hasOff,raw:league.official?.matches||[]};
  const R=resolveTpl(tpl,league.teams,forceProj?null:league.official);
  const groupViews=tpl.groups.map(G=>{const keys=G.slots.map(s=>league.teams.find(x=>x.seed===s)?.key).filter(Boolean);
    const ms=G.ids.map(id=>({...R.res[id].match,lab:tpl.matches.find(m=>m.id===id).lab,id}));
    const p=R.positions(G.name);const rank=G.kind==='mod'?{mod:true,order:p,rows:keys.map(k=>({key:k})),complete:!!p}:standings(keys,ms.filter(m=>m.a&&m.b));
    return {name:G.name,teams:keys,matches:ms,rank,kind:G.kind}});
  const ko=tpl.matches.filter(m=>m.sec).map(m=>({id:m.id,t:m,A:R.res[m.id].A,B:R.res[m.id].B,match:R.res[m.id].match}));
  const fin=cvfFinal(tpl,R);
  const done=tpl.matches.some(m=>m.place&&winLose(R.res[m.id].match))||league.system==='cvf-q18'&&ko.every(k=>winLose(k.match));
  return {kind:'cvf',tpl,R,byKey,groups:groupViews,ko,official:hasOff&&!forceProj,hasOfficial:hasOff,final:done?fin:null,
    allMatches:tpl.matches.map(m=>({id:m.id,t:m,match:R.res[m.id].match}))};
}
function build(t,league,forceProj){return isCvf(league)?buildCvf(t,league,forceProj):buildPvs(t,league,forceProj)}

function refLabel(r){if(!r)return '';if(r.s!==undefined)return '#'+r.s;if(r.g)return r.pos+r.g;if(r.w)return T('W')+' '+r.w;if(r.l)return T('L')+' '+r.l;return ''}
function teamName(L,k){const tm=L.byKey[k];return tm?`${esc(tm.p1)} / ${esc(tm.p2)}`:esc(k||'')}
function placeTxt(r){if(r.q)return 'Q';return r.place===r.to?r.place+'.':r.place+'.–'+r.to+'.'}
function whenTxt(m){const bits=[];if(m.date)bits.push(esc(m.date));if(m.time)bits.push(esc(m.time));return bits.join(' ')}

/* ---- list view ---- */
function listView(){
  const all=DATA.tournaments;
  const opts=(arr,cur)=>arr.map(([v,l])=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(l)}</option>`).join('');
  const cats=[...new Set(all.map(catOf))].filter(Boolean).sort();
  const seasons=[...new Set(all.map(seasonOf))].sort().reverse();
  const players=DATA.players;
  const pass=t=>(F.player==='all'||playersIn(t).includes(F.player))&&(F.series==='all'||seriesOf(t)===F.series)&&(F.cat==='all'||catOf(t)===F.cat)&&(F.season==='all'||seasonOf(t)===F.season);
  const today=new Date().toISOString().slice(0,10);
  const list=all.filter(pass).sort((a,b)=>{const ua=a.date>=today,ub=b.date>=today;if(ua!==ub)return ua?-1:1;return ua?a.date.localeCompare(b.date):b.date.localeCompare(a.date)});
  let h=profilesView()+`<div class="filters">
    <label><span class="eyebrow">${T('player')}</span><select id="fPlayer">${opts([['all',T('both')],...players.map(p=>[p,p])],F.player)}</select></label>
    <label><span class="eyebrow">${T('series')}</span><select id="fSeries">${opts([['all',T('all')],['pbl',T('s_pbl')],['leto',T('s_leto')],['abv',T('s_abv')]],F.series)}</select></label>
    <label><span class="eyebrow">${T('category')}</span><select id="fCat">${opts([['all',T('all')],...cats.map(c=>[c,c])],F.cat)}</select></label>
    <label><span class="eyebrow">${T('season')}</span><select id="fSeason">${opts([['all',T('all')],...seasons.map(s=>[s,s])],F.season)}</select></label>
  </div><div class="count">${T('found',list.length)}</div><div class="tlist">`;
  if(!list.length)h+=`<div class="empty"><p class="note">${T('none')}</p></div>`;
  for(const t of list){
    const chips=[];
    for(const lg of t.leagues){const fks=focusKeys(lg);if(!fks.length)continue;let L=null;try{L=build(t,lg,false)}catch{}
      for(const k of fks){const tm=lg.teams.find(x=>x.key===k);const who=(focusOf(tm)||[]).map(FIRST).join(' + ');
        const fr=L&&L.final&&L.final.find(r=>r.key===k);
        const fn=(focusOf(tm)||[]).map(x=>x.toLowerCase());const partner=[tm.p1,tm.p2].find(x=>!fn.includes((x||'').toLowerCase()));
        const ln=(lg.name||'').match(/(\d+)/);const lgTxt=t.source==='pvs'&&ln?T('leagueN',ln[1]):(lg.system==='cvf-q18'?T('qualif'):'');
        if(lg.system==='cvf-q18'&&fr&&fr.q)continue;
        if(/kvalifikace/i.test(lg.name||'')&&t.leagues.some(o=>o!==lg&&o.teams.some(x=>x.key===k)))continue;
        const bits=[lgTxt,fr?placeTxt(fr):''].filter(Boolean).join(' · ');
        const pend=!fr&&statusOf(t)==='finished'&&lg.teams.length?' · '+T('noResult'):'';
        chips.push(`<span class="pill her chipwrap"><b>${esc(who)}</b>${partner?' + '+esc(partner):''}${bits?' · '+esc(bits):''}${pend}</span>`)}}
    if(!t.leagues.length)chips.push(`<span class="pill">${T('notReg')}</span>`);
    const sx=statusOf(t);const st=sx==='live'?`<span class="pill live">${T('live')}</span>`:sx==='upcoming'?`<span class="pill">${T('upcoming')}</span>`:'';
    h+=`<button type="button" class="trow" data-id="${esc(t.id)}"><span class="d">${fmtDate(t.date)}<small>${esc(fmtDay(t.date))}</small></span>
      <span class="n"><b>${esc(t.name)}</b><span>${esc(t.round||'')}${t.round?' · ':''}${esc(t.venue||'')} · ${T('s_'+seriesOf(t))}</span></span>
      <span class="who">${st}${chips.join('')}</span></button>`}
  h+='</div>';
  $('#view').innerHTML=h;
  const bind=(id,key)=>$(id).addEventListener('change',e=>{F[key]=e.target.value;try{localStorage.setItem('filters',JSON.stringify(F))}catch{};listView()});
  bind('#fPlayer','player');bind('#fSeries','series');bind('#fCat','cat');bind('#fSeason','season');
  document.querySelectorAll('.trow').forEach(b=>b.addEventListener('click',()=>{location.hash=b.dataset.id}));
}

function detailView(t){
  const fkAll=new Set(t.leagues.flatMap(focusKeys));
  const defLeague=t.leagues.findIndex(l=>focusKeys(l).length&&(isCvf(l)?(l.system!=='cvf-q18'||!t.leagues.some(x=>x!==l&&focusKeys(x).length)):true));
  const li=leagueSel[t.id]??(defLeague>=0?defLeague:0);const league=t.leagues[li];

function bindBack(){$('#backBtn').addEventListener('click',()=>{history.pushState(null,'',location.pathname+location.search);cur=null;render()})}

// Her tournament: every match of her pair across stages, in order, plus where she goes next
function herBlock(t,player){
  const items=[];let me=null,info='',finTxt='',paths='';
  for(const lg of t.leagues){
    const tm=lg.teams.find(x=>(focusOf(x)||[]).includes(player));if(!tm)continue;me=tm;const k=tm.key;
    const L=build(t,lg,false);const stageName=isCvf(lg)?(lg.system==='cvf-q18'?T('qualif'):T('main')):lg.name;
    const g=L.groups.find(x=>x.teams.includes(k));
    if(g)for(const m of [...g.matches].sort((a,b)=>(a.no||a.round||0)-(b.no||b.round||0)))if(m.a===k||m.b===k)items.push(tlItem(m,k,L,`${stageName} · ${T('group')} ${g.name}`));
    const ko=[...L.ko].sort((a,b)=>(a.match.no||a.t.round||0)-(b.match.no||b.t.round||0));
    for(const r of ko)if(r.match.a===k||r.match.b===k)items.push(tlItem({...r.match,round:r.match.round||r.t.round,id:r.id},k,L,`${stageName} · ${T(r.t.stage)}`));
    info=`${T('seed')} ${tm.seed}${tm.club?' · '+esc(tm.club):''}${g?` · ${T('group')} ${g.name}`:''}`;
    const fr=L.final&&L.final.find(r=>r.key===k);
    if(fr&&!fr.q)finTxt=`<span class="pill her">${T('finalPlace')} ${placeTxt(fr)}${fr.pts!==undefined?' · '+fr.pts+' '+T('pts'):''}</span>`;
    if(statusOf(t)!=='finished')paths+=nextPaths(L,k,g);
  }
  if(!me)return '';
  return `<section class="herbox"><div class="who"><span class="eyebrow">${T('herDay')}</span><b>${esc(me.p1)} / ${esc(me.p2)}</b><span class="note">${info}</span>${finTxt}</div>
    <div class="timeline">${items.join('')||`<p class="note">${T('matchesAppear')}</p>`}</div>${paths}</section>`;
}
function tlItem(m,k,L,ctx){
  const opp=m.a===k?m.b:m.a;const s=parseSets(m.sets);let cls='p',txt=T('toPlay');
  if(s){const mine=m.a===k?s:[s[1],s[0]];cls=mine[0]>mine[1]?'w':'l';txt=`${mine[0]}:${mine[1]}`}
  const pts=s&&m.points?(m.a===k?m.points:String(m.points).replace(/(\d+)\s*:\s*(\d+)/g,'$2:$1')):'';
  const o=L.byKey[opp];const top=m.id?m.id:(m.round?'R'+m.round:'');
  const when=[whenTxt(m),m.court?T('court')+' '+esc(m.court):''].filter(Boolean).join(' · ');
  const rlab=m.round?(/^\d+$/.test(String(m.round))&&!m.id?'':esc(m.round)):'';
  return `<div class="tl"><div class="rd">${esc(top)}<small>${when||rlab}</small></div>
   <div class="vs"><div class="opp">${o?`${esc(o.p1)} / ${esc(o.p2)}`:esc(opp||'?')}</div><div class="sub">${esc(ctx)}${o?` · ${T('seed')} ${o.seed}`:''}${pts?' · '+esc(pts):''}</div></div>
   <div class="res ${cls}">${txt}</div></div>`;
}
// Where she goes next: from the group (by position) or from her latest knockout match (if win / if loss)
function nextPaths(L,k,g){
  const tplMatches=L.kind==='pvs'?(L.tpl||[]):(L.tpl?L.tpl.matches:[]);if(!tplMatches.length)return '';
  const res=Object.fromEntries(L.ko.map(r=>[r.id,r]));if(L.kind==='cvf')for(const m of L.allMatches)res[m.id]=res[m.id]||{id:m.id,t:m.t,match:m.match};
  const otherLabel=(t,side)=>{const r=side==='a'?t.b:t.a;const rr=res[t.id];const team=rr&&(side==='a'?rr.match.b:rr.match.a);return team?teamName(L,team):esc(refLabel(r))};
  const succ=(id,kind)=>tplMatches.filter(t=>(t.a&&t.a[kind]===id)||(t.b&&t.b[kind]===id)).map(t=>({t,side:t.a&&t.a[kind]===id?'a':'b'}));
  const mine=Object.values(res).filter(r=>r.match&&(r.match.a===k||r.match.b===k)).sort((a,b)=>(a.match.no||a.t.round||0)-(b.match.no||b.t.round||0));
  const last=mine[mine.length-1];
  const card=(title,list,outPlace)=>`<div class="path"><b>${title}</b>${list.length?list.map(x=>`${esc(T(x.t.stage||'')||'')} ${esc(x.t.id)} ${T('vs')} ${otherLabel(x.t,x.side)}`).join('<br>'):(outPlace?`${T('out')} ${outPlace}`:'')}</div>`;
  if(last&&last.t&&(last.t.sec||L.kind==='pvs'&&!last.t.grp)&&!(L.kind==='pvs'&&!last.t.id)){
    const wl=winLose(last.match);
    if(!wl){const w=succ(last.id||last.t.id,'w'),l=succ(last.id||last.t.id,'l');if(!w.length&&!l.length&&!last.t.out&&!last.t.qualify)return '';
      return `<div class="eyebrow">${T('next')}: ${esc(last.t.id)}</div><div class="paths">${card(T('ifWin'),w,last.t.qualify?T('qualified'):'')}${card(T('ifLoss'),l,last.t.out)}</div>`}
    return '';
  }
  if(g&&L.groups.length){const res2=g.rank&&g.rank.complete;if(res2)return '';
    const out=[];for(let p=1;p<=g.teams.length;p++){const tm=tplMatches.find(x=>(x.a&&x.a.g===g.name&&x.a.pos===p)||(x.b&&x.b.g===g.name&&x.b.pos===p));
      if(tm){const other=tm.a.g===g.name&&tm.a.pos===p?tm.b:tm.a;out.push(`<div class="path"><b>${T('nth',p)}</b>${esc(T(tm.stage))} ${esc(tm.id||'')} ${T('vs')} ${esc(refLabel(other))}</div>`)}
      else if(L.tpl&&L.tpl.groupOut&&L.tpl.groupOut[p])out.push(`<div class="path"><b>${T('nth',p)}</b>${T('out')} ${L.tpl.groupOut[p]}</div>`)}
    if(out.length)return `<div class="eyebrow">${T('afterGroups')}</div><div class="paths">${out.join('')}</div>`}
  return '';
}
function finalBlock(t,league,L,fks){
  if(!L.final||!L.final.length)return '';const pvs=L.kind==='pvs';
  const list=[...L.final].filter(r=>!r.q).sort((a,b)=>a.place-b.place);
  const tr=r=>`<tr class="${fks.has(r.key)?'mine':''}"><td>${placeTxt(r)}</td><td>${teamName(L,r.key)}<span class="club">${esc(L.byKey[r.key]?.club||'')}</span></td>${pvs?`<td>${r.pts}</td>`:''}</tr>`;
  const head=`<thead><tr><th>${T('place')}</th><th>${T('pair')}</th>${pvs?`<th>${T('points')}</th>`:''}</tr></thead>`;
  const short=list.filter((r,i)=>i<4||fks.has(r.key));
  const body=list.length>8?`<table class="tbl">${head}<tbody>${short.map(tr).join('')}</tbody></table><details class="fulllist" ontoggle="this.previousElementSibling.hidden=this.open"><summary>${T('showAll',list.length)}</summary><table class="tbl">${head}<tbody>${list.map(tr).join('')}</tbody></table></details>`:`<table class="tbl">${head}<tbody>${list.map(tr).join('')}</tbody></table>`;
  return `<section class="block"><h2>${T('standings')}</h2><p class="note">${T('standingsNote')}${pvs?T('pointsNote',league.name):''}</p>${body}</section>`;
}
// Group as a cross table like the printed sheet at the venue
function groupCard(g,L,fks){
  const teams=g.teams;const pos=Object.fromEntries(teams.map((k,i)=>[k,i+1]));
  const real=g.matches.filter(m=>pos[m.a]&&pos[m.b]);
  let rank={},rowOf={};const anyPlayed=real.some(m=>parseSets(m.sets));
  if(g.rank&&g.rank.mod){(g.rank.order||[]).forEach((k,i)=>rank[k]=i+1)}else if(g.rank){g.rank.rows.forEach((r,i)=>{rank[r.key]=i+1;rowOf[r.key]=r})}
  const sums=k=>{let sw=0,sl=0,pw=0,pl=0;for(const m of real){const s=parseSets(m.sets);if(!s)continue;const p=String(m.points||'');let a=0,b=0;for(const x of p.matchAll(/(\d+)\s*:\s*(\d+)/g)){a+=+x[1];b+=+x[2]}
      if(m.a===k){sw+=s[0];sl+=s[1];pw+=a;pl+=b}else if(m.b===k){sw+=s[1];sl+=s[0];pw+=b;pl+=a}}return {sw,sl,pw,pl}};
  const find=(x,y)=>real.find(m=>(m.a===x&&m.b===y)||(m.a===y&&m.b===x));
  const short=k=>{const tm=L.byKey[k];return tm?`<span class="pn">${esc(tm.p1.split(' ').slice(-1)[0])}</span><span class="pn">${esc(tm.p2.split(' ').slice(-1)[0])}</span>`:esc(k)};
  const full=k=>{const tm=L.byKey[k];return tm?`<span class="sn">${esc(tm.p1.split(' ').slice(-1)[0])} / ${esc(tm.p2.split(' ').slice(-1)[0])}</span><span class="pn">${esc(tm.p1)}</span><span class="pn">${esc(tm.p2)}</span><span class="club">${esc(tm.club||'')}</span>`:esc(k)};
  const isMine=k=>fks.has(k);
  const head=teams.map(k=>`<th class="${isMine(k)?'mine':''}" scope="col"><span class="no">${pos[k]}</span>${short(k)}</th>`).join('');
  const body=teams.map(r=>{const cells=teams.map(c=>{if(r===c)return '<td class="diag"></td>';
      const m=find(r,c);if(!m)return '<td class="none"></td>';const s=parseSets(m.sets);
      if(!s)return `<td class="cell todo ${isMine(r)||isMine(c)?'her':''}"><span class="rr">${esc(m.id||('R'+m.round))}</span></td>`;
      const mine=m.a===r?s:[s[1],s[0]];const pts=m.a===r?(m.points||''):String(m.points||'').replace(/(\d+)\s*:\s*(\d+)/g,'$2:$1');
      return `<td class="cell ${mine[0]>mine[1]?'w':'l'}"><b>${mine[0]}:${mine[1]}</b><small>${esc(pts)}</small></td>`}).join('');
    const x=sums(r);
    return `<tr class="${isMine(r)?'mine':''}"><th scope="row"><span class="no">${pos[r]}</span>${full(r)}</th>${cells}<td class="sum">${x.sw}:${x.sl}</td><td class="sum">${x.pw}:${x.pl}</td><td class="rank">${anyPlayed&&rank[r]?rank[r]+'.':''}</td></tr>`}).join('');
  const ordMatches=[...g.matches].sort((a,b)=>(a.no||a.round||0)-(b.no||b.round||0));
  const order=ordMatches.map(m=>{const done=!!parseSets(m.sets);const her=isMine(m.a)||isMine(m.b);
    let lab=m.lab||'';if(lab==='W')lab=T('W')+'-'+T('W');if(lab==='L')lab=T('L')+'-'+T('L');
    return `<span class="ord ${done?'done':''} ${her?'her':''}">${esc(lab)}</span>`}).join('');
  const complete=g.rank&&g.rank.complete;
  return `<article class="group ${teams.some(isMine)?'mine':''}"><header><h3>${T('group')} ${esc(g.name)}</h3>${complete?`<span class="pill">${T('final')}</span>`:anyPlayed?`<span class="pill live">${T('inPlay')}</span>`:''}</header>
   <div class="xscroll"><table class="xt"><thead><tr><th class="corner">${T('group')} ${esc(g.name)}</th>${head}<th class="sum">${T('sets')}</th><th class="sum">${T('balls')}</th><th class="rank">${T('place')}</th></tr></thead><tbody>${body}</tbody></table></div>
   <div class="order"><span class="eyebrow">${T('order')}</span>${order}</div></article>`;
}
function bmatch(r,L,fks,showStage){
  const m=r.match;const s=parseSets(m.sets);
  const side=(key,ref,isA)=>{const won=s&&key&&((isA&&s[0]>s[1])||(!isA&&s[1]>s[0]));
    const lab=key?teamShort(L,key):`<span class="slot">${esc(ref?(ref.label||refLabel(ref.ref||ref)):'')}</span>`;
    return `<div class="row ${won?'won':''} ${key&&fks.has(key)?'mine':''}"><span>${lab}</span><span class="s">${s?(isA?s[0]:s[1]):''}</span></div>`};
  const mine=fks.has(m.a)||fks.has(m.b);
  const foot=[showStage?esc(T(r.t.stage)):'',esc(r.id||('R'+(m.round||r.t.round))),whenTxt(m),m.court?T('court')+' '+esc(m.court):'',m.points?esc(m.points):'',r.t.est?T('est'):''].filter(Boolean).join(' · ');
  return `<div class="bm ${mine?'mine':''}">${side(m.a,r.A,true)}${side(m.b,r.B,false)}<div class="foot">${foot}</div></div>`;
}
function teamShort(L,k){const tm=L.byKey[k];return tm?esc(tm.p1.split(' ').slice(-1)[0]+' / '+tm.p2.split(' ').slice(-1)[0]):esc(k)}
function koBlock(t,L,fks,proj){
  if(L.kind==='cvf-raw'){if(!L.raw.length)return '';return `<section class="block"><h2>${T('playoff')}</h2><div class="places">${L.raw.map(m=>bmatch({t:{stage:''},id:'M'+m.no,A:null,B:null,match:m},L,fks,false)).join('')}</div></section>`}
  if(!L.ko.length){
    if(L.kind==='pvs'&&L.officialPlayoff.length)return `<section class="block"><h2>${T('playoff')}</h2><div class="places">${L.officialPlayoff.map(m=>bmatch({t:{stage:''},A:null,B:null,match:m},L,fks,false)).join('')}</div></section>`;
    const msg=L.kind==='pvs'?(L.layout.playoff==='24T-8G'?T('noPlayoff')['24T-8G']:T('noPlayoff').none):T('noPlayoff').skup;
    return `<section class="block"><h2>${T('playoff')}</h2><p class="note">${msg}</p></section>`}
  const note=`<p class="note">${proj?T('slotNote'):T('slotNoteOff')}</p>`;
  if(L.kind==='pvs'){
    const cols=L.tpl.some(x=>x.col===0)?[0,1,2,3]:[2,3];const names={0:'r12',1:'qf',2:'sf',3:'medals'};
    const col=c=>L.ko.filter(r=>r.t.col===c);

    return `<section class="block"><h2>${T('playoff')}</h2>${note}${br}<h3>${T('placement')}</h3><div class="places">${rest.map(r=>bmatch(r,L,fks,true)).join('')}</div></section>`}
  let h=`<section class="block"><h2>${T('playoff')}</h2>${note}`;

    const nc=sec.cols.length;
    h+=`<h3>${T(sec.title)}</h3><div class="bracket-scroll"><div class="bracket" style="grid-template-columns:repeat(${nc},minmax(170px,1fr));min-width:${nc*185}px">${sec.cols.map((c,i)=>`<div class="bcol"><h4>${T(c)}</h4>${ms.filter(r=>r.t.col===i).map(r=>bmatch(r,L,fks,sec.key==='fin'||c==='medals')).join('')}</div>`).join('')}</div></div>`}
  return h+'</section>';
}
function pairsBlock(league,fks){

    const work=d.filter(x=>x.status==='working'&&recent(x)).length;const wait=d.filter(x=>x.status==='pending'&&x.type!=='refresh').length;
    busy=work>0;setBusy(busy);
    $('#queueInfo').textContent=(work?T('busy',work)+' ':'')+(wait?T('queue',wait):'')},()=>{})}catch{}
  const TRIGGER='trig_01V1CxQm76ag84gww5afYKfk';
  async function kick(){try{const mcp=await window.claude.use('mcp');if(!mcp)return false;
      const lt=await mcp.listTools('Claude Code Remote');const srv=(lt.servers||[]).find(s=>s.server==='Claude Code Remote');
      const tool=srv&&srv.tools.find(t=>/fire_trigger$/.test(t.name));if(!tool)return false;
      await mcp.callTool('Claude Code Remote',tool.name,{trigger_id:TRIGGER},{cache:false});return true}catch(e){return false}}
  async function queue(job,okKey){
    try{await col.add({...job,status:'pending',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()})}catch(err){$('#addMsg').textContent=T('saveFail');return}
    $('#addMsg').textContent=T('starting');const ok=await kick();$('#addMsg').textContent=ok?T(okKey):T('kickFail')}
  $('#addForm').addEventListener('submit',async e=>{e.preventDefault();const url=$('#linkInput').value.trim();
    if(!/^https:\/\/(www\.|old\.)?(volejbalpraha\.cz|cvf\.cz)\//.test(url)){$('#addMsg').textContent=T('badLink');return}
    $('#linkInput').value='';await queue({type:'add',url},'loadingAdd')});
  const doRefresh=()=>{if(busy)return;busy=true;setBusy(true);queue({type:'refresh'},'loadingRefresh')};
  $('#refreshBtn').addEventListener('click',doRefresh);$('#refreshTop').addEventListener('click',doRefresh);
})();
</script>
